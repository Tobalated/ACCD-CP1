<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Embodied Motion — Live Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.dom.min.js"></script>

  <!-- ml5.js -->
  <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>

  <style>
    /* ===== RESET ===== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    canvas {
      display: block;
    }

    /* ===== INSTRUCTION OVERLAY ===== */
    .overlay {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.02em;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="overlay">
    Move your hands slowly in front of the camera
  </div>

  <script>
    let video;
    let poseNet;
    let poses = [];
    let particles = [];

    function setup() {
      createCanvas(windowWidth, windowHeight);

      video = createCapture(VIDEO);
      video.size(width, height);
      video.hide();

      poseNet = ml5.poseNet(video, () => {
        console.log("PoseNet loaded");
      });

      poseNet.on("pose", results => {
        poses = results;
      });

      for (let i = 0; i < 120; i++) {
        particles.push(new Particle());
      }
    }

    function draw() {
      background(5, 8, 22, 40);

      if (poses.length > 0) {
        let pose = poses[0].pose;
        let leftWrist = pose.leftWrist;
        let rightWrist = pose.rightWrist;

        if (leftWrist.confidence > 0.3 && rightWrist.confidence > 0.3) {
          let d = dist(
            leftWrist.x,
            leftWrist.y,
            rightWrist.x,
            rightWrist.y
          );

          particles.forEach(p => p.react(d));
        }
      }

      particles.forEach(p => {
        p.update();
        p.display();
      });
    }

    class Particle {
      constructor() {
        this.pos = createVector(random(width), random(height));
        this.vel = p5.Vector.random2D().mult(random(0.2, 1));
        this.size = random(2, 6);
      }

      react(force) {
        let mapped = map(force, 40, 300, 0.3, 2, true);
        this.vel.mult(mapped);
      }

      update() {
        this.pos.add(this.vel);
        this.vel.limit(2);

        if (this.pos.x < 0 || this.pos.x > width) this.vel.x *= -1;
        if (this.pos.y < 0 || this.pos.y > height) this.vel.y *= -1;
      }

      display() {
        noStroke();
        fill(159, 209, 255, 180);
        circle(this.pos.x, this.pos.y, this.size);
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>

</body>
</html>
